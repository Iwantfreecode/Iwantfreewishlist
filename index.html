<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Wishlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column. Title and totals on top, filters, then a stack of item rows. Edit tools appear only for the owner. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #13202B;
  --muted: #586775;
  --line: #D3DAE1;
  --chip: #E3E8ED;
  --accent: #2447F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EAFF;
  --accent-text: #1B37C4;
  --good: #17835A;
  --good-soft: #DDF3E8;
  --danger: #B3261E;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16202A; --ink: #E7EDF2; --muted: #92A3B1; --line: #283642;
    --chip: #22303B; --accent: #8FA4FF; --accent-ink: #0E151B; --accent-soft: #232F66;
    --accent-text: #B5C3FF; --good: #4FC88F; --good-soft: #163B2C; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16202A; --ink: #E7EDF2; --muted: #92A3B1; --line: #283642;
  --chip: #22303B; --accent: #8FA4FF; --accent-ink: #0E151B; --accent-soft: #232F66;
  --accent-text: #B5C3FF; --good: #4FC88F; --good-soft: #163B2C; --danger: #FF8A80;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); }
* { box-sizing: border-box; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 96px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.title {
  display: block; width: 100%; padding: 0 0 4px; margin: 0;
  font: 800 clamp(32px, 9vw, 48px)/1.05 var(--font-display);
  letter-spacing: -0.02em; text-wrap: balance;
  background: transparent; border: 0; border-bottom: 2px dashed transparent; border-radius: 0;
}
.title:not([readonly]) { border-bottom-color: var(--line); }
.summary { margin: 10px 0 10px; color: var(--muted); }
.summary strong { color: var(--ink); font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .25s; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 260px; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; font-weight: 500; font-size: 13px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--font-mono); opacity: .65; margin-left: 4px; }
.sortlabel { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
select, input[type=text], input[type=number], input[type=url], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
}
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 8px 14px; font-weight: 600; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.status { min-height: 1.5em; margin: 10px 0 0; font-size: 13px; color: var(--muted); }

.panel { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }
.panel .grow { flex: 1 1 auto; }
.form { margin-top: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; display: grid; gap: 12px; }
.form h2 { margin: 0; font: 700 18px var(--font-display); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { resize: vertical; line-height: 1.4; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
.formerr { color: var(--danger); font-size: 13px; margin: 0; min-height: 1.2em; }
.formbtns { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 480px) { .fields { grid-template-columns: minmax(0, 1fr); } }

.list { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
}
.tick {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: transparent;
  display: grid; place-items: center; padding: 0; color: transparent; margin-top: 1px;
}
.tick:not(:disabled) { cursor: pointer; }
.tick:not(:disabled):hover { border-color: var(--good); }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface); }
.tick svg { width: 16px; height: 16px; }
.main { min-width: 0; }
.nameline { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.row.got .name { text-decoration: line-through; color: var(--muted); }
.row.got { background: transparent; }
.link { font-size: 13px; color: var(--accent-text); text-decoration: none; border-bottom: 1px solid currentColor; overflow-wrap: anywhere; }
.note { margin: 2px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.tag.must { background: var(--accent); color: var(--accent-ink); }
.tag.want { background: var(--accent-soft); color: var(--accent-text); }
.tag.someday { background: var(--chip); color: var(--muted); }
.tag.example { border: 1px dashed var(--muted); color: var(--muted); }
.tag.gotten { background: var(--good-soft); color: var(--good); }
.price { font: 500 16px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row.got .price { color: var(--muted); }
.actions { grid-column: 2 / -1; display: flex; gap: 8px; margin-top: 8px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.savebar .in { max-width: 720px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
</style>

</head>
<body>
<main class="wrap">
  <header>
    <input id="title" class="title" type="text" value="My Wishlist" aria-label="List title" readonly maxlength="60">
    <p class="summary" id="summary">Loading your list…</p>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  </header>

  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="Filter items"></div>
    <label class="sortlabel" for="sort">Sort
      <select id="sort">
        <option value="priority">Priority</option>
        <option value="high">Price, high to low</option>
        <option value="low">Price, low to high</option>
        <option value="new">Newest first</option>
      </select>
    </label>
    <button class="btn small" id="copyBtn" type="button">Copy list</button>
    <button class="btn small" id="editToggle" type="button" hidden>Edit list</button>
  </div>
  <p class="status" id="status" role="status"></p>

  <div class="panel" id="panel" hidden>
    <button class="btn primary" id="addBtn" type="button">Add item</button>
    <label class="sortlabel" for="currency">Currency
      <select id="currency">
        <option value="THB">THB ฿</option>
        <option value="USD">USD $</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
        <option value="JPY">JPY ¥</option>
      </select>
    </label>
    <span class="grow"></span>
    <button class="btn small danger" id="clearEx" type="button" hidden>Remove example items</button>
  </div>

  <form class="form" id="form" hidden novalidate>
    <h2 id="formTitle">Add item</h2>
    <div class="fields">
      <div class="field full"><label for="f-name">Item</label><input id="f-name" type="text" maxlength="120" placeholder="What do you want?" autocomplete="off"></div>
      <div class="field"><label for="f-price">Price</label><input id="f-price" type="number" inputmode="decimal" min="0" step="any" placeholder="Optional"></div>
      <div class="field"><label for="f-pri">Priority</label>
        <select id="f-pri"><option value="must">Must have</option><option value="want" selected>Want</option><option value="someday">Someday</option></select>
      </div>
      <div class="field full"><label for="f-urls">Links</label><textarea id="f-urls" rows="3" placeholder="One link per line" autocomplete="off"></textarea></div>
      <div class="field full"><label for="f-note">Note</label><input id="f-note" type="text" maxlength="200" placeholder="Size, colour, where to buy" autocomplete="off"></div>
    </div>
    <p class="formerr" id="formerr" role="alert"></p>
    <div class="formbtns">
      <button class="btn primary" id="formSubmit" type="submit">Add item</button>
      <button class="btn" id="formCancel" type="button">Cancel</button>
    </div>
  </form>

  <ul class="list" id="list"><li class="empty">Loading your list…</li></ul>
</main>

<div class="savebar" id="savebar" hidden>
  <div class="in">
    <span id="savemsg">Unsaved changes</span>
    <button class="btn primary" id="saveBtn" type="button">Save</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var PRI = { must: { label: 'Must have', rank: 0 }, want: { label: 'Want', rank: 1 }, someday: { label: 'Someday', rank: 2 } };
  var CURRENCIES = ['THB', 'USD', 'EUR', 'GBP', 'JPY'];
  var PENDING_KEY = 'wishlist-pending';
  var $ = function (id) { return document.getElementById(id); };
  var data = { title: 'My Wishlist', currency: 'THB', items: [] };
  var art = null, user = null;
  var editing = false, canWrite = true, dirty = false, saving = false;
  var filter = 'all', sort = 'priority', editId = null, delId = null, delTimer = 0, statusTimer = 0;
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';

  function uid() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function normUrls(x) {
    var list = Array.isArray(x.urls) ? x.urls : [];
    if (!list.length && typeof x.url === 'string' && x.url) list = [x.url];
    return list.filter(function (u) { return typeof u === 'string' && u; }).slice(0, 10);
  }
  function normalize(d) {
    var out = { title: 'My Wishlist', currency: 'THB', items: [] };
    if (!d || typeof d !== 'object') return out;
    if (typeof d.title === 'string' && d.title.trim()) out.title = d.title.slice(0, 60);
    if (CURRENCIES.indexOf(d.currency) >= 0) out.currency = d.currency;
    (Array.isArray(d.items) ? d.items : []).forEach(function (x) {
      if (!x || typeof x.name !== 'string' || !x.name.trim()) return;
      var p = typeof x.price === 'number' && isFinite(x.price) && x.price >= 0 ? x.price : null;
      out.items.push({
        id: typeof x.id === 'string' && x.id ? x.id : uid(),
        name: x.name.slice(0, 120),
        price: p,
        urls: normUrls(x),
        note: typeof x.note === 'string' ? x.note.slice(0, 200) : '',
        priority: PRI[x.priority] ? x.priority : 'want',
        got: !!x.got,
        example: !!x.example
      });
    });
    return out;
  }
  function money(n) {
    if (n == null || isNaN(n)) return '–';
    try {
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: data.currency, currencyDisplay: 'narrowSymbol', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n);
    } catch (e) { return data.currency + ' ' + n; }
  }
  function safeUrl(u) {
    if (!u) return null;
    try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch (e) { return null; }
  }
  function showEdit() {
    if (!art || !canWrite) return false;
    if (user && typeof user.canEdit === 'function' && user.canEdit() === false) return false;
    return true;
  }
  function setStatus(msg, keep) {
    $('status').textContent = msg || '';
    clearTimeout(statusTimer);
    if (msg && !keep) statusTimer = setTimeout(function () { $('status').textContent = ''; }, 4000);
  }
  function touch(rerender) {
    dirty = true;
    if (rerender !== false) render(); else renderSavebar();
  }

  function visibleItems() {
    var idx = {};
    data.items.forEach(function (x, i) { idx[x.id] = i; });
    var it = data.items.filter(function (x) {
      if (filter === 'all') return true;
      if (filter === 'got') return x.got;
      return x.priority === filter;
    });
    it.sort(function (a, b) {
      if (sort === 'new') return idx[b.id] - idx[a.id];
      if (sort === 'high' || sort === 'low') {
        var pa = a.price == null ? null : a.price, pb = b.price == null ? null : b.price;
        if (pa === null && pb === null) return idx[a.id] - idx[b.id];
        if (pa === null) return 1;
        if (pb === null) return -1;
        return sort === 'high' ? pb - pa : pa - pb;
      }
      if (a.got !== b.got) return a.got ? 1 : -1;
      var r = PRI[a.priority].rank - PRI[b.priority].rank;
      return r || idx[a.id] - idx[b.id];
    });
    return it;
  }

  function renderSummary() {
    var n = data.items.length;
    var left = data.items.filter(function (x) { return !x.got; });
    var total = left.reduce(function (s, x) { return s + (x.price || 0); }, 0);
    var s = $('summary');
    s.textContent = '';
    if (!n) { s.textContent = 'No items yet.'; $('barfill').style.width = '0'; return; }
    s.appendChild(el('strong', null, money(total)));
    s.appendChild(document.createTextNode(' still to get · ' + left.length + ' left · ' + (n - left.length) + ' got'));
    $('barfill').style.width = Math.round(((n - left.length) / n) * 100) + '%';
  }

  function renderChips() {
    var wrap = $('chips');
    wrap.textContent = '';
    var defs = [['all', 'All'], ['must', 'Must have'], ['want', 'Want'], ['someday', 'Someday'], ['got', 'Got']];
    defs.forEach(function (d) {
      var count = data.items.filter(function (x) {
        return d[0] === 'all' ? true : d[0] === 'got' ? x.got : x.priority === d[0];
      }).length;
      var b = el('button', 'chip');
      b.type = 'button';
      b.setAttribute('aria-pressed', filter === d[0] ? 'true' : 'false');
      b.appendChild(document.createTextNode(d[1]));
      b.appendChild(el('span', 'n', String(count)));
      b.addEventListener('click', function () { filter = d[0]; render(); });
      wrap.appendChild(b);
    });
  }

  function buildRow(x) {
    var li = el('li', 'row' + (x.got ? ' got' : ''));
    var tick = el('button', 'tick');
    tick.type = 'button';
    tick.innerHTML = CHECK;
    tick.setAttribute('aria-pressed', x.got ? 'true' : 'false');
    tick.setAttribute('aria-label', (x.got ? 'Got it: ' : 'Mark as got: ') + x.name);
    tick.disabled = !editing;
    tick.addEventListener('click', function () { x.got = !x.got; touch(); });
    li.appendChild(tick);

    var main = el('div', 'main');
    var line = el('div', 'nameline');
    line.appendChild(el('span', 'name', x.name));
    main.appendChild(line);
    var valid = x.urls.map(function (raw) { return safeUrl(raw); }).filter(Boolean);
    var seen = {}, total = {};
    valid.forEach(function (u) { var h = u.hostname.replace(/^www\./, ''); total[h] = (total[h] || 0) + 1; });
    var links = el('div', 'links');
    valid.forEach(function (u) {
      var h = u.hostname.replace(/^www\./, '');
      seen[h] = (seen[h] || 0) + 1;
      var a = el('a', 'link', h + (total[h] > 1 ? ' ' + seen[h] : '') + ' ↗');
      a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      links.appendChild(a);
    });
    if (valid.length) main.appendChild(links);
    if (x.note) main.appendChild(el('p', 'note', x.note));
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'tag ' + x.priority, PRI[x.priority].label));
    if (x.got) meta.appendChild(el('span', 'tag gotten', 'Got it'));
    if (x.example) meta.appendChild(el('span', 'tag example', 'Example'));
    main.appendChild(meta);
    li.appendChild(main);

    li.appendChild(el('div', 'price', money(x.price)));

    if (editing) {
      var act = el('div', 'actions');
      var eb = el('button', 'btn small', 'Edit'); eb.type = 'button';
      eb.addEventListener('click', function () { openForm(x); });
      var db = el('button', 'btn small danger', delId === x.id ? 'Tap again to delete' : 'Delete'); db.type = 'button';
      db.addEventListener('click', function () {
        if (delId === x.id) {
          data.items = data.items.filter(function (y) { return y.id !== x.id; });
          delId = null; clearTimeout(delTimer); touch();
        } else {
          delId = x.id; clearTimeout(delTimer);
          delTimer = setTimeout(function () { delId = null; render(); }, 3500);
          render();
        }
      });
      act.appendChild(eb); act.appendChild(db);
      li.appendChild(act);
    }
    return li;
  }

  function renderList() {
    var ul = $('list');
    ul.textContent = '';
    var items = visibleItems();
    if (!items.length) {
      var msg = data.items.length
        ? 'Nothing in this filter.'
        : (showEdit() ? 'Your list is empty. Tap Edit list, then Add item.' : 'This list is empty.');
      ul.appendChild(el('li', 'empty', msg));
      return;
    }
    items.forEach(function (x) { ul.appendChild(buildRow(x)); });
  }

  function renderSavebar() {
    var show = dirty && canWrite && !!art;
    $('savebar').hidden = !show;
    $('saveBtn').disabled = saving;
    $('saveBtn').textContent = saving ? 'Saving…' : 'Save';
  }

  function render() {
    var can = showEdit();
    if (!can) editing = false;
    $('editToggle').hidden = !can;
    $('editToggle').textContent = editing ? 'Done' : 'Edit list';
    $('title').readOnly = !editing;
    $('panel').hidden = !editing;
    if (!editing) $('form').hidden = true;
    $('currency').value = data.currency;
    $('sort').value = sort;
    $('clearEx').hidden = !data.items.some(function (x) { return x.example; });
    if ($('title').value !== data.title) $('title').value = data.title;
    document.title = data.title || 'My Wishlist';
    renderSummary();
    renderChips();
    renderList();
    renderSavebar();
  }

  function openForm(item) {
    editId = item ? item.id : null;
    $('formTitle').textContent = item ? 'Edit item' : 'Add item';
    $('formSubmit').textContent = item ? 'Update item' : 'Add item';
    $('f-name').value = item ? item.name : '';
    $('f-price').value = item && item.price != null ? String(item.price) : '';
    $('f-pri').value = item ? item.priority : 'want';
    $('f-urls').value = item ? item.urls.join('\n') : '';
    $('f-note').value = item ? item.note : '';
    $('formerr').textContent = '';
    $('form').hidden = false;
    $('form').scrollIntoView({ block: 'center' });
    $('f-name').focus();
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('f-name').value.trim();
    if (!name) { $('formerr').textContent = 'Give the item a name.'; $('f-name').focus(); return; }
    var priceRaw = $('f-price').value.trim();
    var price = null;
    if (priceRaw !== '') {
      price = Number(priceRaw);
      if (!isFinite(price) || price < 0) { $('formerr').textContent = 'Price must be a number, 0 or more.'; $('f-price').focus(); return; }
    }
    var urls = [], bad = false;
    $('f-urls').value.split(/[\s,]+/).forEach(function (u) {
      if (!u) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      if (!safeUrl(u)) bad = true;
      else if (urls.indexOf(u) < 0) urls.push(u);
    });
    if (bad) { $('formerr').textContent = 'One of the links does not look right. Put one full address on each line.'; $('f-urls').focus(); return; }
    if (urls.length > 10) { $('formerr').textContent = 'Up to 10 links per item.'; $('f-urls').focus(); return; }
    var fields = { name: name, price: price, urls: urls, note: $('f-note').value.trim(), priority: $('f-pri').value };
    if (editId) {
      data.items.forEach(function (x) { if (x.id === editId) { Object.assign(x, fields); x.example = false; } });
    } else {
      data.items.push(Object.assign({ id: uid(), got: false, example: false }, fields));
    }
    $('form').hidden = true;
    editId = null;
    touch();
  });
  $('formCancel').addEventListener('click', function () { $('form').hidden = true; editId = null; });
  $('addBtn').addEventListener('click', function () { openForm(null); });
  $('clearEx').addEventListener('click', function () {
    data.items = data.items.filter(function (x) { return !x.example; });
    touch();
  });
  $('editToggle').addEventListener('click', function () { editing = !editing; render(); });
  $('sort').addEventListener('change', function () { sort = $('sort').value; render(); });
  $('currency').addEventListener('change', function () { data.currency = $('currency').value; touch(); });
  $('title').addEventListener('input', function () {
    data.title = $('title').value.slice(0, 60) || 'My Wishlist';
    document.title = data.title;
    touch(false);
  });

  $('copyBtn').addEventListener('click', function () {
    var lines = [data.title, ''];
    data.items.forEach(function (x) {
      lines.push((x.got ? '[x] ' : '[ ] ') + x.name + (x.price != null ? ' – ' + money(x.price) : '') + ' (' + PRI[x.priority].label + ')' + x.urls.map(function (u) { return ' ' + u; }).join(''));
    });
    var text = lines.join('\n');
    try {
      navigator.clipboard.writeText(text).then(
        function () { setStatus('List copied.'); },
        function () { setStatus('Copying is blocked in this view.'); }
      );
    } catch (e) { setStatus('Copying is blocked in this view.'); }
  });

  $('saveBtn').addEventListener('click', function () {
    if (!art || saving) return;
    saving = true; renderSavebar(); setStatus('Saving…', true);
    var json = JSON.stringify(data, null, 2);
    try { sessionStorage.setItem(PENDING_KEY, json); } catch (e) {}
    art.publish({ 'wishlist.json': json }).then(function () {
      saving = false; dirty = false;
      try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
      setStatus('Saved. The link now shows this version.');
      render();
    }, function (err) {
      saving = false;
      var code = err && err.code;
      if (code === 'conflict') {
        setStatus('Someone saved first. Reloading with your changes kept.', true);
      } else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'capability_disabled' || code === 'consent_required') {
        canWrite = false;
        try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
        setStatus('Saving is not available in this view. Open the page from your own artifacts, or ask Claude to update the list.', true);
      } else if (code === 'rate_limited') {
        setStatus('Saving too fast. Wait a moment and try again.');
      } else {
        setStatus('Could not save. Try again in a moment.');
      }
      render();
    });
  });

  function load() {
    return fetch('wishlist.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('bad status');
      return r.json();
    }).then(function (j) { data = normalize(j); }, function () { data = normalize(null); })
      .then(function () {
        try {
          var p = sessionStorage.getItem(PENDING_KEY);
          if (p) { data = normalize(JSON.parse(p)); dirty = true; sessionStorage.removeItem(PENDING_KEY); }
        } catch (e) {}
      });
  }

  function initCaps() {
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve();
    return Promise.all([
      window.claude.use('artifact').catch(function () { return null; }),
      window.claude.use('user').catch(function () { return null; })
    ]).then(function (r) { art = r[0]; user = r[1]; });
  }

  load().then(function () { render(); return initCaps(); }).then(function () { render(); });
})();
</script>

</body>
</html>
