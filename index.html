<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My Wishlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a typed list. One left-aligned column, no cards. Each line is name, dotted leader, price. Notes and links sit underneath. */
:root {
  --bg: #FFFFFF;
  --ink: #1A1A1A;
  --muted: #6A6A6A;
  --line: #B9B9B9;
  --mark: #FFE45C;
  --mark-ink: #1A1A1A;
  --link: #1736C9;
  --danger: #B3261E;
  --font: 'Courier Prime', 'Courier New', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --ink: #EDEDED; --muted: #9A9A9A; --line: #4A4A4A;
    --mark: #F2D23C; --mark-ink: #141414; --link: #8FA8FF; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --ink: #EDEDED; --muted: #9A9A9A; --line: #4A4A4A;
  --mark: #F2D23C; --mark-ink: #141414; --link: #8FA8FF; --danger: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font); }
.wrap { max-width: 42rem; margin-left: clamp(0px, 6vw, 80px); padding-inline: 16px; padding-block: 32px 96px; }
button, input, select, textarea { font: inherit; color: inherit; border-radius: 0; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
a { color: var(--link); text-underline-offset: 3px; }

.title {
  display: block; width: 100%; margin: 0; padding: 0 0 8px;
  font: 700 clamp(26px, 7vw, 38px)/1.15 var(--font);
  background: transparent; border: 0; border-bottom: 2px solid var(--ink); text-wrap: balance;
}
.title:not([readonly]) { border-bottom-style: dashed; }
.summary { margin: 12px 0 0; }
.summary strong { font-weight: 700; }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.f { border: 0; background: none; padding: 1px 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.f[aria-pressed="true"] { background: var(--ink); color: var(--bg); text-decoration: none; }
.sortlabel { display: flex; align-items: center; gap: 8px; color: var(--muted); }
select, input[type=text], input[type=number], textarea {
  background: var(--bg); border: 1px solid var(--ink); padding: 6px 8px; min-width: 0;
}
.btn { border: 1px solid var(--ink); background: var(--bg); color: var(--ink); padding: 5px 12px; cursor: pointer; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--bg); color: var(--ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: var(--bg); }
.btn.small { padding: 1px 8px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.status { min-height: 1.55em; margin: 10px 0 0; color: var(--muted); font-size: 14px; }

.panel { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border: 1px dashed var(--muted); }
.panel .grow { flex: 1 1 auto; }
.form { display: grid; gap: 12px; margin-top: 14px; padding: 16px; border: 2px solid var(--ink); }
.form h2 { margin: 0; font: 700 18px var(--font); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { color: var(--muted); font-size: 14px; }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { resize: vertical; line-height: 1.4; }
.formerr { margin: 0; min-height: 1.3em; color: var(--danger); font-size: 14px; }
.formbtns { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 480px) { .fields { grid-template-columns: minmax(0, 1fr); } }

.list { display: grid; gap: 18px; list-style: none; margin: 22px 0 0; padding: 0; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; }
.box { border: 0; background: none; padding: 0; white-space: pre; line-height: inherit; align-self: start; cursor: default; }
.box:not(:disabled) { cursor: pointer; }
.box:not(:disabled):hover { background: var(--mark); color: var(--mark-ink); }
.body { min-width: 0; }
.line { display: flex; align-items: baseline; gap: 6px; }
.name { min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.row.must:not(.got) .name { background: var(--mark); color: var(--mark-ink); padding: 0 4px; }
.row.got .name { font-weight: 400; color: var(--muted); text-decoration: line-through; }
.lead { flex: 1 1 12px; min-width: 12px; border-bottom: 1px dotted var(--muted); transform: translateY(-4px); }
.price { white-space: nowrap; }
.row.got .price { color: var(--muted); }
.details { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 16px; margin: 6px 0 0; }
.details dt { color: var(--muted); }
.details dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.linkrow { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.actions { display: flex; gap: 8px; margin-top: 6px; }
.empty { padding: 12px 0; color: var(--muted); }

.savebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--ink); color: var(--bg);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.savebar .in { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 42rem; margin-left: clamp(0px, 6vw, 80px); }
.savebar .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); }
</style>

</head>
<body>
<main class="wrap">
  <header>
    <input id="title" class="title" type="text" value="My Wishlist" aria-label="List title" readonly maxlength="60">
    <p class="summary" id="summary">Loading your list…</p>
  </header>

  <div class="tools">
    <div class="filters" id="chips" role="group" aria-label="Filter items"></div>
    <label class="sortlabel" for="sort">sort
      <select id="sort">
        <option value="priority">priority</option>
        <option value="high">price, high to low</option>
        <option value="low">price, low to high</option>
        <option value="new">newest first</option>
      </select>
    </label>
    <button class="btn small" id="copyBtn" type="button">Copy list</button>
    <button class="btn small" id="editToggle" type="button" hidden>Edit list</button>
  </div>
  <p class="status" id="status" role="status"></p>

  <div class="panel" id="panel" hidden>
    <button class="btn primary" id="addBtn" type="button">Add item</button>
    <label class="sortlabel" for="currency">currency
      <select id="currency">
        <option value="THB">THB ฿</option>
        <option value="USD">USD $</option>
        <option value="EUR">EUR €</option>
        <option value="GBP">GBP £</option>
        <option value="JPY">JPY ¥</option>
      </select>
    </label>
    <span class="grow"></span>
    <button class="btn small danger" id="clearEx" type="button" hidden>Remove example items</button>
  </div>

  <form class="form" id="form" hidden novalidate>
    <h2 id="formTitle">Add item</h2>
    <div class="fields">
      <div class="field full"><label for="f-name">item</label><input id="f-name" type="text" maxlength="120" placeholder="What do you want?" autocomplete="off"></div>
      <div class="field full"><label for="f-price">price (one number, a range, or around)</label><input id="f-price" type="text" placeholder="1200  or  1000-1500  or  around 1500" autocomplete="off"></div>
      <div class="field full"><label for="f-pri">priority</label>
        <select id="f-pri"><option value="must">must have</option><option value="want" selected>want</option><option value="someday">someday</option><option value="essential">essential (everyday stuff)</option></select>
      </div>
      <div class="field full"><label for="f-urls">links</label><textarea id="f-urls" rows="3" placeholder="one link per line" autocomplete="off"></textarea></div>
      <div class="field full"><label for="f-note">detail</label><input id="f-note" type="text" maxlength="200" placeholder="size, colour, where to buy" autocomplete="off"></div>
    </div>
    <p class="formerr" id="formerr" role="alert"></p>
    <div class="formbtns">
      <button class="btn primary" id="formSubmit" type="submit">Add item</button>
      <button class="btn" id="formCancel" type="button">Cancel</button>
    </div>
  </form>

  <ul class="list" id="list"><li class="empty">Loading your list…</li></ul>
</main>

<div class="savebar" id="savebar" hidden>
  <div class="in">
    <span id="savemsg">Unsaved changes</span>
    <button class="btn" id="saveBtn" type="button">Save</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var PRI = { must: { label: 'Must have', rank: 0 }, want: { label: 'Want', rank: 1 }, someday: { label: 'Someday', rank: 2 }, essential: { label: 'Essential (everyday stuff)', rank: 3 } };
  var CURRENCIES = ['THB', 'USD', 'EUR', 'GBP', 'JPY'];
  var PENDING_KEY = 'wishlist-pending';
  var $ = function (id) { return document.getElementById(id); };
  var data = { title: 'My Wishlist', currency: 'THB', items: [] };
  var art = null, user = null;
  var editing = false, canWrite = true, dirty = false, saving = false;
  var filter = 'all', sort = 'priority', editId = null, delId = null, delTimer = 0, statusTimer = 0;

  function uid() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function normUrls(x) {
    var list = Array.isArray(x.urls) ? x.urls : [];
    if (!list.length && typeof x.url === 'string' && x.url) list = [x.url];
    return list.filter(function (u) { return typeof u === 'string' && u; }).slice(0, 10);
  }
  function normalize(d) {
    var out = { title: 'My Wishlist', currency: 'THB', items: [] };
    if (!d || typeof d !== 'object') return out;
    if (typeof d.title === 'string' && d.title.trim()) out.title = d.title.slice(0, 60);
    if (CURRENCIES.indexOf(d.currency) >= 0) out.currency = d.currency;
    (Array.isArray(d.items) ? d.items : []).forEach(function (x) {
      if (!x || typeof x.name !== 'string' || !x.name.trim()) return;
      var p = typeof x.price === 'number' && isFinite(x.price) && x.price >= 0 ? x.price : null;
      var pm = p !== null && typeof x.priceMax === 'number' && isFinite(x.priceMax) && x.priceMax > p ? x.priceMax : null;
      out.items.push({
        id: typeof x.id === 'string' && x.id ? x.id : uid(),
        name: x.name.slice(0, 120),
        price: p,
        priceMax: pm,
        approx: p !== null && pm === null && !!x.approx,
        urls: normUrls(x),
        note: typeof x.note === 'string' ? x.note.slice(0, 200) : '',
        priority: PRI[x.priority] ? x.priority : 'want',
        got: !!x.got,
        example: !!x.example
      });
    });
    return out;
  }
  function money(n) {
    if (n == null || isNaN(n)) return 'price?';
    try {
      return new Intl.NumberFormat(undefined, { style: 'currency', currency: data.currency, currencyDisplay: 'narrowSymbol', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n);
    } catch (e) { return data.currency + ' ' + n; }
  }
  function priceText(x) {
    if (x.price == null) return 'price?';
    if (x.priceMax != null && x.priceMax > x.price) return money(x.price) + '–' + money(x.priceMax);
    return (x.approx ? 'around ' : '') + money(x.price);
  }
  function midPrice(x) {
    if (x.price == null) return null;
    return (x.price + (x.priceMax != null ? x.priceMax : x.price)) / 2;
  }
  function priceInput(x) {
    if (x.price == null) return '';
    if (x.priceMax != null && x.priceMax > x.price) return x.price + '-' + x.priceMax;
    return (x.approx ? 'around ' : '') + x.price;
  }
  function parsePrice(text) {
    var t = String(text || '').trim().toLowerCase();
    if (!t) return { price: null, priceMax: null, approx: false };
    var approx = /(~|\baround\b|\babout\b|\bapprox\w*|\broughly\b|\bca\b)/.test(t);
    var c = t.replace(/,/g, '').replace(/[฿$€£¥]/g, '').replace(/\b(thb|usd|eur|gbp|jpy|baht)\b/g, '');
    c = c.replace(/(\d+(?:\.\d+)?)\s*k\b/g, function (m, n) { return String(Number(n) * 1000); });
    var nums = c.match(/\d+(?:\.\d+)?/g) || [];
    if (!nums.length || nums.length > 2) return null;
    var a = Number(nums[0]), b = nums.length === 2 ? Number(nums[1]) : null;
    if (b !== null && b < a) { var sw = a; a = b; b = sw; }
    if (b !== null && b === a) b = null;
    return { price: a, priceMax: b, approx: approx && b === null };
  }
  function safeUrl(u) {
    if (!u) return null;
    try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch (e) { return null; }
  }
  function showEdit() {
    if (!art || !canWrite) return false;
    if (user && typeof user.canEdit === 'function' && user.canEdit() === false) return false;
    return true;
  }
  function setStatus(msg, keep) {
    $('status').textContent = msg || '';
    clearTimeout(statusTimer);
    if (msg && !keep) statusTimer = setTimeout(function () { $('status').textContent = ''; }, 4000);
  }
  function touch(rerender) {
    dirty = true;
    if (rerender !== false) render(); else renderSavebar();
  }

  function visibleItems() {
    var idx = {};
    data.items.forEach(function (x, i) { idx[x.id] = i; });
    var it = data.items.filter(function (x) {
      if (filter === 'all') return true;
      if (filter === 'got') return x.got;
      return x.priority === filter;
    });
    it.sort(function (a, b) {
      if (sort === 'new') return idx[b.id] - idx[a.id];
      if (sort === 'high' || sort === 'low') {
        var pa = midPrice(a), pb = midPrice(b);
        if (pa === null && pb === null) return idx[a.id] - idx[b.id];
        if (pa === null) return 1;
        if (pb === null) return -1;
        return sort === 'high' ? pb - pa : pa - pb;
      }
      if (a.got !== b.got) return a.got ? 1 : -1;
      var r = PRI[a.priority].rank - PRI[b.priority].rank;
      return r || idx[a.id] - idx[b.id];
    });
    return it;
  }

  function renderSummary() {
    var n = data.items.length;
    var left = data.items.filter(function (x) { return !x.got; });
    var lo = left.reduce(function (s, x) { return s + (x.price || 0); }, 0);
    var hi = left.reduce(function (s, x) { return s + ((x.priceMax != null ? x.priceMax : x.price) || 0); }, 0);
    var anyApprox = left.some(function (x) { return x.approx && x.price != null; });
    var totalText = lo !== hi ? money(lo) + '–' + money(hi) : (anyApprox ? 'around ' : '') + money(lo);
    var s = $('summary');
    s.textContent = '';
    if (!n) { s.textContent = 'Nothing here yet.'; return; }
    s.appendChild(el('strong', null, totalText));
    s.appendChild(document.createTextNode(' still to get. ' + left.length + ' left, ' + (n - left.length) + ' got.'));
  }

  function renderChips() {
    var wrap = $('chips');
    wrap.textContent = '';
    var defs = [['all', 'all'], ['must', 'must have'], ['want', 'want'], ['someday', 'someday'], ['essential', 'essentials'], ['got', 'got']];
    defs.forEach(function (d) {
      var count = data.items.filter(function (x) {
        return d[0] === 'all' ? true : d[0] === 'got' ? x.got : x.priority === d[0];
      }).length;
      var b = el('button', 'f', d[1] + ' (' + count + ')');
      b.type = 'button';
      b.setAttribute('aria-pressed', filter === d[0] ? 'true' : 'false');
      b.addEventListener('click', function () { filter = d[0]; render(); });
      wrap.appendChild(b);
    });
  }

  function buildRow(x) {
    var li = el('li', 'row' + (x.got ? ' got' : '') + (x.priority === 'must' ? ' must' : ''));
    var box = el('button', 'box', x.got ? '[x]' : '[ ]');
    box.type = 'button';
    box.setAttribute('aria-pressed', x.got ? 'true' : 'false');
    box.setAttribute('aria-label', (x.got ? 'Got it: ' : 'Mark as got: ') + x.name);
    box.disabled = !editing;
    box.addEventListener('click', function () { x.got = !x.got; touch(); });
    li.appendChild(box);

    var body = el('div', 'body');
    var line = el('div', 'line');
    line.appendChild(el('span', 'name', x.name));
    line.appendChild(el('span', 'lead'));
    line.appendChild(el('span', 'price', priceText(x)));
    body.appendChild(line);
    var dl = el('dl', 'details');
    function detail(label, value) {
      dl.appendChild(el('dt', null, label));
      var dd = el('dd');
      if (typeof value === 'string') dd.textContent = value; else dd.appendChild(value);
      dl.appendChild(dd);
    }
    if (x.note) detail('detail', x.note);
    detail('priority', PRI[x.priority].label.toLowerCase());
    var valid = x.urls.map(function (raw) { return safeUrl(raw); }).filter(Boolean);
    if (valid.length) {
      var seen = {}, total = {}, linkrow = el('span', 'linkrow');
      valid.forEach(function (u) { var h = u.hostname.replace(/^www\./, ''); total[h] = (total[h] || 0) + 1; });
      valid.forEach(function (u) {
        var h = u.hostname.replace(/^www\./, '');
        seen[h] = (seen[h] || 0) + 1;
        var a = el('a', 'link', h + (total[h] > 1 ? ' ' + seen[h] : ''));
        a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        linkrow.appendChild(a);
      });
      detail(valid.length > 1 ? 'links' : 'link', linkrow);
    }
    if (x.got) detail('status', 'got it');
    if (x.example) detail('status', 'example');
    body.appendChild(dl);

    if (editing) {
      var act = el('div', 'actions');
      var eb = el('button', 'btn small', 'Edit'); eb.type = 'button';
      eb.addEventListener('click', function () { openForm(x); });
      var db = el('button', 'btn small danger', delId === x.id ? 'Tap again to delete' : 'Delete'); db.type = 'button';
      db.addEventListener('click', function () {
        if (delId === x.id) {
          data.items = data.items.filter(function (y) { return y.id !== x.id; });
          delId = null; clearTimeout(delTimer); touch();
        } else {
          delId = x.id; clearTimeout(delTimer);
          delTimer = setTimeout(function () { delId = null; render(); }, 3500);
          render();
        }
      });
      act.appendChild(eb); act.appendChild(db);
      body.appendChild(act);
    }
    li.appendChild(body);
    return li;
  }

  function renderList() {
    var ul = $('list');
    ul.textContent = '';
    var items = visibleItems();
    if (!items.length) {
      var msg = data.items.length
        ? 'Nothing in this filter.'
        : (showEdit() ? 'Your list is empty. Tap Edit list, then Add item.' : 'This list is empty.');
      ul.appendChild(el('li', 'empty', msg));
      return;
    }
    items.forEach(function (x) { ul.appendChild(buildRow(x)); });
  }

  function renderSavebar() {
    var show = dirty && canWrite && !!art;
    $('savebar').hidden = !show;
    $('saveBtn').disabled = saving;
    $('saveBtn').textContent = saving ? 'Saving…' : 'Save';
  }

  function render() {
    var can = showEdit();
    if (!can) editing = false;
    $('editToggle').hidden = !can;
    $('editToggle').textContent = editing ? 'Done' : 'Edit list';
    $('title').readOnly = !editing;
    $('panel').hidden = !editing;
    if (!editing) $('form').hidden = true;
    $('currency').value = data.currency;
    $('sort').value = sort;
    $('clearEx').hidden = !data.items.some(function (x) { return x.example; });
    if ($('title').value !== data.title) $('title').value = data.title;
    document.title = data.title || 'My Wishlist';
    renderSummary();
    renderChips();
    renderList();
    renderSavebar();
  }

  function openForm(item) {
    editId = item ? item.id : null;
    $('formTitle').textContent = item ? 'Edit item' : 'Add item';
    $('formSubmit').textContent = item ? 'Update item' : 'Add item';
    $('f-name').value = item ? item.name : '';
    $('f-price').value = item ? priceInput(item) : '';
    $('f-pri').value = item ? item.priority : 'want';
    $('f-urls').value = item ? item.urls.join('\n') : '';
    $('f-note').value = item ? item.note : '';
    $('formerr').textContent = '';
    $('form').hidden = false;
    $('form').scrollIntoView({ block: 'center' });
    $('f-name').focus();
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('f-name').value.trim();
    if (!name) { $('formerr').textContent = 'Give the item a name.'; $('f-name').focus(); return; }
    var pp = parsePrice($('f-price').value);
    if (pp === null) { $('formerr').textContent = 'Price: type one number, a range like 1000-1500, or something like around 1500.'; $('f-price').focus(); return; }
    var urls = [], bad = false;
    $('f-urls').value.split(/[\s,]+/).forEach(function (u) {
      if (!u) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      if (!safeUrl(u)) bad = true;
      else if (urls.indexOf(u) < 0) urls.push(u);
    });
    if (bad) { $('formerr').textContent = 'One of the links does not look right. Put one full address on each line.'; $('f-urls').focus(); return; }
    if (urls.length > 10) { $('formerr').textContent = 'Up to 10 links per item.'; $('f-urls').focus(); return; }
    var fields = { name: name, price: pp.price, priceMax: pp.priceMax, approx: pp.approx, urls: urls, note: $('f-note').value.trim(), priority: $('f-pri').value };
    if (editId) {
      data.items.forEach(function (x) { if (x.id === editId) { Object.assign(x, fields); x.example = false; } });
    } else {
      data.items.push(Object.assign({ id: uid(), got: false, example: false }, fields));
    }
    $('form').hidden = true;
    editId = null;
    touch();
  });
  $('formCancel').addEventListener('click', function () { $('form').hidden = true; editId = null; });
  $('addBtn').addEventListener('click', function () { openForm(null); });
  $('clearEx').addEventListener('click', function () {
    data.items = data.items.filter(function (x) { return !x.example; });
    touch();
  });
  $('editToggle').addEventListener('click', function () { editing = !editing; render(); });
  $('sort').addEventListener('change', function () { sort = $('sort').value; render(); });
  $('currency').addEventListener('change', function () { data.currency = $('currency').value; touch(); });
  $('title').addEventListener('input', function () {
    data.title = $('title').value.slice(0, 60) || 'My Wishlist';
    document.title = data.title;
    touch(false);
  });

  $('copyBtn').addEventListener('click', function () {
    var lines = [data.title, ''];
    data.items.forEach(function (x) {
      lines.push((x.got ? '[x] ' : '[ ] ') + x.name + (x.price != null ? ' – ' + priceText(x) : '') + ' (' + PRI[x.priority].label + ')' + x.urls.map(function (u) { return ' ' + u; }).join(''));
    });
    var text = lines.join('\n');
    try {
      navigator.clipboard.writeText(text).then(
        function () { setStatus('List copied.'); },
        function () { setStatus('Copying is blocked in this view.'); }
      );
    } catch (e) { setStatus('Copying is blocked in this view.'); }
  });

  $('saveBtn').addEventListener('click', function () {
    if (!art || saving) return;
    saving = true; renderSavebar(); setStatus('Saving…', true);
    var json = JSON.stringify(data, null, 2);
    try { sessionStorage.setItem(PENDING_KEY, json); } catch (e) {}
    art.publish({ 'wishlist.json': json }).then(function () {
      saving = false; dirty = false;
      try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
      setStatus('Saved. The link now shows this version.');
      render();
    }, function (err) {
      saving = false;
      var code = err && err.code;
      if (code === 'conflict') {
        setStatus('Someone saved first. Reloading with your changes kept.', true);
      } else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'capability_disabled' || code === 'consent_required') {
        canWrite = false;
        try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
        setStatus('Saving is not available in this view. Open the page from your own artifacts, or ask Claude to update the list.', true);
      } else if (code === 'rate_limited') {
        setStatus('Saving too fast. Wait a moment and try again.');
      } else {
        setStatus('Could not save. Try again in a moment.');
      }
      render();
    });
  });

  function load() {
    return fetch('wishlist.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('bad status');
      return r.json();
    }).then(function (j) { data = normalize(j); }, function () { data = normalize(null); })
      .then(function () {
        try {
          var p = sessionStorage.getItem(PENDING_KEY);
          if (p) { data = normalize(JSON.parse(p)); dirty = true; sessionStorage.removeItem(PENDING_KEY); }
        } catch (e) {}
      });
  }

  function initCaps() {
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve();
    return Promise.all([
      window.claude.use('artifact').catch(function () { return null; }),
      window.claude.use('user').catch(function () { return null; })
    ]).then(function (r) { art = r[0]; user = r[1]; });
  }

  load().then(function () { render(); return initCaps(); }).then(function () { render(); });
})();
</script>

</body>
</html>
